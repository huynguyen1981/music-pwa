<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Music Player</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff2dff">

<style>
:root {
  --bg: #050510;
  --bg2: #0b0b18;
  --card: #141424;
  --card2: #1c1c30;
  --glass: rgba(20,20,40,0.75);
  --border-glass: rgba(255,255,255,0.08);
  --text: #ffffff;
  --text-sub: #b0b0c0;
  --pink: #ff2dff;
  --cyan: #00eaff;
}
:root.light {
  --bg: #f7f4ff;
  --bg2: #f0ecff;
  --card: #ffffff;
  --card2: #f7f3ff;
  --glass: rgba(255,255,255,0.8);
  --border-glass: rgba(0,0,0,0.06);
  --text: #111111;
  --text-sub: #666666;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #1b1030 0, #050510 55%);
  color: var(--text);
  display: flex;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}

.app {
  width: 100%;
  max-width: 480px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* HEADER */
header {
  padding: 16px 18px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-size: 22px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--pink), var(--cyan));
  -webkit-background-clip: text;
  color: transparent;
}
.avatar {
  width: 32px;
  height: 32px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--pink), var(--cyan));
}
#theme-toggle {
  border:none;
  background:rgba(255,255,255,0.06);
  color:var(--text-sub);
  padding:6px 10px;
  border-radius:999px;
  font-size:11px;
}

/* SCREENS */
.screens {
  flex: 1;
  position: relative;
  overflow: hidden;
}
.screen {
  position: absolute;
  inset: 0;
  padding: 10px 16px 110px;
  opacity: 0;
  transform: translateX(40px);
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}
.screen.active {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
}

/* HOME */
.big-icon {
  width: 110px;
  height: 110px;
  border-radius: 32px;
  margin: 10px auto 6px;
  background: linear-gradient(135deg, var(--pink), var(--cyan));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
  color: #000;
  box-shadow: 0 0 25px var(--pink);
}
.subtext {
  text-align: center;
  font-size: 13px;
  color: var(--text-sub);
  padding: 0 30px;
  line-height: 1.4;
}
.controls {
  margin-top: 22px;
  display: flex;
  justify-content: center;
  gap: 22px;
}
.ctrl-btn {
  width: 52px;
  height: 52px;
  border-radius: 999px;
  background: var(--card2);
  border: 2px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: var(--pink);
  box-shadow: 0 0 12px rgba(0,0,0,0.8);
}
.ctrl-btn.play {
  width: 70px;
  height: 70px;
  font-size: 30px;
  background: linear-gradient(135deg, var(--pink), var(--cyan));
  color: #000;
  border: none;
  box-shadow: 0 0 20px var(--pink);
}

/* MINI EQ */
.eq-mini {
  margin: 24px auto 0;
  width: 120px;
  height: 40px;
  display: flex;
  gap: 6px;
  align-items: flex-end;
}
.eq-bar {
  width: 10px;
  background: linear-gradient(180deg, var(--pink), var(--cyan));
  border-radius: 6px;
  animation: bounce 1s infinite ease-in-out;
}
.eq-bar:nth-child(2) { animation-delay: .15s; }
.eq-bar:nth-child(3) { animation-delay: .3s; }
.eq-bar:nth-child(4) { animation-delay: .45s; }

@keyframes bounce {
  0%, 100% { height: 20%; opacity: .5; }
  50% { height: 100%; opacity: 1; }
}

/* PLAYLIST */
.section-title {
  font-size: 14px;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 10px;
}
.playlist-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.pl-tab {
  padding: 7px 12px;
  border-radius: 999px;
  background: rgba(20,20,40,0.9);
  color: var(--text-sub);
  font-size: 13px;
}
.pl-tab.active {
  background: linear-gradient(135deg, var(--pink), var(--cyan));
  color: #000;
  font-weight: 600;
}
.track-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.track-card {
  background: var(--glass);
  border-radius: 16px;
  padding: 10px;
  display: flex;
  gap: 10px;
  align-items: center;
  border: 1px solid var(--border-glass);
  backdrop-filter: blur(16px);
  box-shadow: 0 0 18px rgba(0,0,0,0.7);
}
.track-thumb {
  width: 70px;
  height: 70px;
  border-radius: 14px;
  overflow: hidden;
  background: #000;
  flex-shrink: 0;
}
.track-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.track-info {
  flex: 1;
}
.track-title {
  font-size: 14px;
  font-weight: 600;
}
.track-meta {
  font-size: 12px;
  color: var(--text-sub);
  margin-top: 3px;
}
.track-play {
  width: 40px;
  height: 40px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--pink), var(--cyan));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #000;
  font-size: 18px;
  box-shadow: 0 0 15px var(--pink);
  cursor: pointer;
}

/* EQ SCREEN */
.eq-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 12px;
}
.eq-visual {
  margin: 10px auto 18px;
  width: 180px;
  height: 70px;
  display: flex;
  gap: 6px;
  align-items: flex-end;
}
.eq-visual .eq-bar {
  width: 12px;
}
.knobs {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 10px;
}
.knob-wrap {
  text-align: center;
  font-size: 12px;
  color: var(--text-sub);
}
.knob {
  width: 70px;
  height: 70px;
  border-radius: 999px;
  margin: 0 auto 6px;
  background: radial-gradient(circle at 30% 30%, #ffffff33 0, #000 55%);
  border: 2px solid var(--border-glass);
  position: relative;
  box-shadow: 0 0 18px rgba(0,0,0,0.8);
}
.knob-dot {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: var(--cyan);
  top: 8px;
  left: 50%;
  transform: translateX(-50%) rotate(0deg);
  transform-origin: 50% 27px;
}

/* MINI PLAYER */
.mini-player {
  position: fixed;
  left: 0; right: 0;
  bottom: 70px;
  max-width: 480px;
  margin: 0 auto;
  height: 56px;
  padding: 6px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(10,10,20,0.9);
  border-top: 1px solid var(--border-glass);
  backdrop-filter: blur(18px);
}
.mini-thumb {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
}
.mini-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.mini-info {
  flex: 1;
}
.mini-title {
  font-size: 13px;
}
.mini-meta {
  font-size: 11px;
  color: var(--text-sub);
}
.mini-play {
  width: 34px;
  height: 34px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--pink), var(--cyan));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #000;
  font-size: 18px;
  cursor: pointer;
}
.mini-progress {
  width: 100%;
  height: 3px;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  overflow: hidden;
  margin-top: 3px;
}
.mini-progress-inner {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--pink), var(--cyan));
  transition: width .3s linear;
}

/* NAVBAR */
.navbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  max-width: 480px;
  margin: 0 auto;
  height: 70px;
  background: rgba(5,5,15,0.96);
  border-top: 1px solid #222;
  display: flex;
  justify-content: space-around;
  align-items: center;
  backdrop-filter: blur(18px);
}
.nav-item {
  text-align: center;
  font-size: 11px;
  color: var(--text-sub);
  cursor: pointer;
}
.nav-item .icon {
  font-size: 20px;
  margin-bottom: 2px;
}
.nav-item.active {
  color: var(--cyan);
  font-weight: 600;
}

/* FAB */
.fab {
  position: fixed;
  right: 18px;
  bottom: 130px;
  width: 54px;
  height: 54px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--pink), var(--cyan));
  color: #000;
  font-size: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 20px var(--pink);
  cursor: pointer;
}

/* SHEET */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.sheet {
  width: 100%;
  max-width: 480px;
  background: rgba(15,15,30,0.96);
  border-radius: 18px 18px 0 0;
  padding: 14px 16px 18px;
  border-top: 1px solid var(--border-glass);
  backdrop-filter: blur(22px);
}
.sheet-handle {
  width: 40px;
  height: 4px;
  border-radius: 999px;
  background: #444;
  margin: 0 auto 10px;
}
.sheet-title {
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 10px;
}
.field {
  margin-bottom: 10px;
}
.field label {
  font-size: 12px;
  color: var(--text-sub);
}
.field input {
  width: 100%;
  padding: 9px 10px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #050510;
  color: #fff;
  font-size: 13px;
}
.sheet-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.btn {
  flex: 1;
  padding: 10px;
  border-radius: 999px;
  border: none;
  font-size: 14px;
  cursor: pointer;
}
.btn-ghost {
  background: #222236;
  color: var(--text-sub);
}
.btn-primary {
  background: linear-gradient(135deg, var(--pink), var(--cyan));
  color: #000;
  font-weight: 600;
}
</style>
</head>

<body>
<div class="app">
  <header>
    <div class="logo">Neon Music</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button id="theme-toggle">Dark</button>
      <div class="avatar"></div>
    </div>
  </header>

  <div class="screens">
    <!-- HOME -->
    <div class="screen active" id="screen-home">
      <div class="big-icon">🎤</div>
      <div class="subtext">
        Nghe nhạc kiểu neon — playlist YouTube, UI xịn, cảm hứng như club nhưng ngồi tại nhà.
      </div>
      <div class="controls">
        <div class="ctrl-btn" id="btn-prev">⏮</div>
        <div class="ctrl-btn play" id="btn-play-main">▶</div>
        <div class="ctrl-btn" id="btn-next">⏭</div>
      </div>
      <div class="eq-mini">
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
      </div>
    </div>

    <!-- PLAYLIST -->
    <div class="screen" id="screen-playlist">
      <div class="section-title">Playlist</div>
      <div class="playlist-tabs" id="playlist-tabs"></div>
      <div class="track-list" id="track-list"></div>
    </div>

    <!-- EQ -->
    <div class="screen" id="screen-eq">
      <div class="eq-title">Equalizer</div>
      <div class="eq-visual">
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
      </div>
      <div class="knobs">
        <div class="knob-wrap">
          <div class="knob">
            <div class="knob-dot" id="knob-bass"></div>
          </div>
          <div>Bass</div>
        </div>
        <div class="knob-wrap">
          <div class="knob">
            <div class="knob-dot" id="knob-treble"></div>
          </div>
          <div>Treble</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MINI PLAYER -->
  <div class="mini-player" id="mini-player">
    <div class="mini-thumb"><img id="mini-thumb-img" src="" alt=""></div>
    <div class="mini-info">
      <div class="mini-title" id="mini-title">Chưa chọn bài</div>
      <div class="mini-meta" id="mini-meta">Playlist • YouTube</div>
      <div class="mini-progress">
        <div class="mini-progress-inner" id="mini-progress-inner"></div>
      </div>
    </div>
    <div class="mini-play" id="mini-play-btn">▶</div>
  </div>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="nav-item active" data-screen="home">
      <div class="icon">🏠</div>
      Trang chủ
    </div>
    <div class="nav-item" data-screen="playlist">
      <div class="icon">🎵</div>
      Playlist
    </div>
    <div class="nav-item" data-screen="eq">
      <div class="icon">🎚️</div>
      EQ
    </div>
  </div>

  <!-- FAB -->
  <div class="fab" id="fab-add">+</div>

  <!-- SHEET -->
  <div class="sheet-backdrop" id="sheet-backdrop">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Thêm bài vào playlist</div>
      <div class="field">
        <label>Tên bài hát (để trống tui tự đặt)</label>
        <input id="input-title" placeholder="VD: Fortnight - Taylor Swift">
      </div>
      <div class="field">
        <label>Link YouTube</label>
        <input id="input-url" placeholder="https://www.youtube.com/watch?v=...">
      </div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="btn-cancel">Hủy</button>
        <button class="btn btn-primary" id="btn-add">Thêm</button>
      </div>
    </div>
  </div>
</div>

<script>
/* PLAYLIST DATA */
const playlists = {
  "Top 10 US-UK": [
    { title: "Fortnight - Taylor Swift", id: "q3zqJs7JUCQ" },
    { title: "Lose Control - Teddy Swims", id: "GZ3zL7kT6_c" },
    { title: "Beautiful Things - Benson Boone", id: "q04KXl4VqAE" },
    { title: "Greedy - Tate McRae", id: "vyBk2l2jv0Y" },
    { title: "Espresso - Sabrina Carpenter", id: "eVli-tstM5E" },
    { title: "Cruel Summer - Taylor Swift", id: "ic8j13piAhQ" },
    { title: "Blinding Lights - The Weeknd", id: "fHI8X4OXluQ" },
    { title: "Flowers - Miley Cyrus", id: "G7KNmW9a75Y" },
    { title: "As It Was - Harry Styles", id: "H5v3kku4y6Q" },
    { title: "Anti-Hero - Taylor Swift", id: "b1kbLwvqugk" }
  ],
  "Top 10 VN": [
    { title: "Nếu lúc đó - tlinh", id: "x5ZkYyqS-gE" },
    { title: "Thích Thích - Phương Ly", id: "5vQwqKqRR3I" },
    { title: "Chúng ta của tương lai - Sơn Tùng M-TP", id: "kXYiU_JCYtU" },
    { title: "Nơi này có anh - Sơn Tùng M-TP", id: "F6Q7kHkG8Vw" },
    { title: "Hơn cả yêu - Đức Phúc", id: "2x8evJ6bQpA" },
    { title: "3107 - W/n", id: "q0hyYWKXF0Q" },
    { title: "Lạc trôi - Sơn Tùng M-TP", id: "Llw9Q6akRo4" },
    { title: "Chạy ngay đi - Sơn Tùng M-TP", id: "32sYGCOYJUM" },
    { title: "Có em - Madihu ft Low G", id: "5vHTh_Ko1x8" },
    { title: "Tháng tư là lời nói dối của em - Hà Anh Tuấn", id: "kqGgqS0bkk8" }
  ],
  "Lo-fi": [
    { title: "lofi hip hop radio - beats to relax/study to", id: "jfKfPfyJRdk" },
    { title: "Chillhop Essentials", id: "5yx6BWlEVcY" }
  ]
};

let currentPlaylistName = "Top 10 US-UK";
let currentTrack = null;

/* DOM */
const screens = {
  home: document.getElementById("screen-home"),
  playlist: document.getElementById("screen-playlist"),
  eq: document.getElementById("screen-eq")
};
const navItems = document.querySelectorAll(".nav-item");
const playlistTabsEl = document.getElementById("playlist-tabs");
const trackListEl = document.getElementById("track-list");
const miniThumbImg = document.getElementById("mini-thumb-img");
const miniTitleEl = document.getElementById("mini-title");
const miniMetaEl = document.getElementById("mini-meta");
const miniPlayBtn = document.getElementById("mini-play-btn");
const miniProgressInner = document.getElementById("mini-progress-inner");
const fabAdd = document.getElementById("fab-add");
const sheetBackdrop = document.getElementById("sheet-backdrop");
const inputTitle = document.getElementById("input-title");
const inputUrl = document.getElementById("input-url");
const btnCancel = document.getElementById("btn-cancel");
const btnAdd = document.getElementById("btn-add");
const knobBass = document.getElementById("knob-bass");
const knobTreble = document.getElementById("knob-treble");
const themeToggle = document.getElementById("theme-toggle");

let currentScreen = "home";

/* THEME */
let isLight = false;
themeToggle.onclick = () => {
  isLight = !isLight;
  document.documentElement.classList.toggle("light", isLight);
  themeToggle.textContent = isLight ? "Light" : "Dark";
};

/* SCREEN SWITCH */
function showScreen(name) {
  if (name === currentScreen) return;
  Object.keys(screens).forEach(key => {
    screens[key].classList.toggle("active", key === name);
  });
  navItems.forEach(item => {
    item.classList.toggle("active", item.dataset.screen === name);
  });
  currentScreen = name;
}
navItems.forEach(item => {
  item.addEventListener("click", () => showScreen(item.dataset.screen));
});

/* PLAYLIST TABS + LIST */
function ytThumb(id) {
  return "https://img.youtube.com/vi/" + id + "/hqdefault.jpg";
}
function renderPlaylistTabs() {
  playlistTabsEl.innerHTML = "";
  Object.keys(playlists).forEach(name => {
    const div = document.createElement("div");
    div.className = "pl-tab" + (name === currentPlaylistName ? " active" : "");
    div.textContent = name;
    div.onclick = () => {
      currentPlaylistName = name;
      renderPlaylistTabs();
      renderTrackList();
    };
    playlistTabsEl.appendChild(div);
  });
}
function renderTrackList() {
  trackListEl.innerHTML = "";
  const list = playlists[currentPlaylistName] || [];
  list.forEach((t, i) => {
    const card = document.createElement("div");
    card.className = "track-card";
    card.innerHTML = `
      <div class="track-thumb">
        <img src="${ytThumb(t.id)}" alt="">
      </div>
      <div class="track-info">
        <div class="track-title">${t.title}</div>
        <div class="track-meta">#${i+1} • ${currentPlaylistName}</div>
      </div>
      <div class="track-play">▶</div>
    `;
    card.querySelector(".track-play").onclick = () => {
      setCurrentTrack(t, currentPlaylistName, i+1);
      openYouTube(t.id);
    };
    trackListEl.appendChild(card);
  });
}

/* CURRENT TRACK + MINI PLAYER */
function setCurrentTrack(track, playlistName, index) {
  currentTrack = { ...track, playlistName, index };
  miniThumbImg.src = ytThumb(track.id);
  miniTitleEl.textContent = track.title;
  miniMetaEl.textContent = `${playlistName} • #${index}`;
}
let fakeProgress = 0;
let fakeTimer = null;
function startFakeProgress() {
  clearInterval(fakeTimer);
  fakeProgress = 0;
  miniProgressInner.style.width = "0%";
  fakeTimer = setInterval(() => {
    fakeProgress += 3;
    if (fakeProgress > 100) fakeProgress = 0;
    miniProgressInner.style.width = fakeProgress + "%";
  }, 800);
}
function openYouTube(id) {
  startFakeProgress();
  location.href = "https://www.youtube.com/watch?v=" + id;
}
miniPlayBtn.onclick = () => {
  if (!currentTrack) return;
  openYouTube(currentTrack.id);
};

/* MAIN PLAYER BUTTONS */
document.getElementById("btn-prev").onclick = () => jumpTrack(-1);
document.getElementById("btn-next").onclick = () => jumpTrack(1);
document.getElementById("btn-play-main").onclick = () => {
  if (!currentTrack) {
    const first = playlists[currentPlaylistName][0];
    if (!first) return;
    setCurrentTrack(first, currentPlaylistName, 1);
  }
  openYouTube(currentTrack.id);
};
function jumpTrack(delta) {
  const list = playlists[currentPlaylistName];
  if (!list || !list.length) return;
  let idx = 0;
  if (currentTrack && currentTrack.playlistName === currentPlaylistName) {
    idx = currentTrack.index - 1;
  }
  idx = (idx + delta + list.length) % list.length;
  const t = list[idx];
  setCurrentTrack(t, currentPlaylistName, idx+1);
}

/* SHEET ADD SONG */
fabAdd.onclick = () => {
  sheetBackdrop.style.display = "flex";
  inputTitle.value = "";
  inputUrl.value = "";
  inputUrl.focus();
};
btnCancel.onclick = () => sheetBackdrop.style.display = "none";
sheetBackdrop.addEventListener("click", e => {
  if (e.target === sheetBackdrop) sheetBackdrop.style.display = "none";
});
function extractId(url) {
  if (!url) return null;
  url = url.trim();
  if (!url.includes(" ") && !url.includes("/") && !url.includes("?")) return url;
  const m = url.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
  return m ? m[1] : null;
}
btnAdd.onclick = () => {
  const rawTitle = inputTitle.value.trim();
  const url = inputUrl.value.trim();
  const id = extractId(url);
  if (!id) {
    alert("Không nhận diện được ID YouTube. Bồ kiểm tra lại link nha.");
    return;
  }
  const title = rawTitle || ("YouTube video (" + id + ")");
  playlists[currentPlaylistName].push({ title, id });
  renderTrackList();
  sheetBackdrop.style.display = "none";
};

/* KNOB FAKE ANIM */
let bassAngle = 0;
let trebleAngle = 0;
function randomKnob() {
  bassAngle = (bassAngle + (Math.random()*40-20)) % 180;
  trebleAngle = (trebleAngle + (Math.random()*40-20)) % 180;
  knobBass.style.transform = `translateX(-50%) rotate(${bassAngle-90}deg)`;
  knobTreble.style.transform = `translateX(-50%) rotate(${trebleAngle-90}deg)`;
}
setInterval(randomKnob, 900);

/* INIT */
renderPlaylistTabs();
renderTrackList();
setCurrentTrack(playlists[currentPlaylistName][0], currentPlaylistName, 1);

/* SW REGISTER */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
