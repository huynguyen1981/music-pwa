<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DriveCompanion - Pro Music Player</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1ED760">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #0B0E14;
      --bg-card: #161A23;
      --bg-accent: #1ED760;
      --text-main: #FFFFFF;
      --text-muted: #8E9AA8;
      --border-radius: 24px;
      --transition: all 0.3s ease;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #030406;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-main);
    }
    .music-app {
      background-color: var(--bg-main);
      width: 100%;
      max-width: 412px;
      height: 844px;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 8px solid #222;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* MẸO MỚI: Đẩy Iframe ẩn xuống dưới dạng vô hình nhưng vẫn nhận tương tác */
    .youtube-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70%;
      opacity: 0.001; /* Vừa đủ vô hình nhưng trình duyệt vẫn tính là có thực thể */
      z-index: 5; /* Nằm ngay dưới nút bấm nhưng phủ trên Artwork nếu chưa kích hoạt */
    }
    .youtube-wrapper iframe {
      width: 100%;
      height: 100%;
    }

    .app-header { padding: 24px 24px 12px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .app-header i { color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
    .app-header span { font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; color: var(--text-muted); }
    
    .player-body { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 32px; z-index: 6; }
    .artwork-wrapper { position: relative; width: 280px; height: 280px; margin-bottom: 32px; cursor: pointer;}
    .artwork-img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--border-radius); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); transition: var(--transition); }
    
    .artwork-wrapper.playing .artwork-img { transform: scale(1.02); }
    .artwork-wrapper.playing::after { content: ''; position: absolute; inset: 0; border-radius: var(--border-radius); box-shadow: 0 0 35px rgba(30, 215, 96, 0.4); z-index: -1; }
    
    .track-info { text-align: center; margin-bottom: 24px; width: 100%; }
    .track-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 0.95rem; color: var(--text-muted); }
    
    .progress-container { width: 100%; margin-bottom: 32px; }
    .progress-bar { width: 100%; height: 6px; background-color: #262D3B; border-radius: 3px; position: relative; cursor: pointer; }
    .progress-current { width: 0%; height: 100%; background-color: var(--bg-accent); border-radius: 3px; transition: width 0.1s linear; }
    .progress-time { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.75rem; color: var(--text-muted); }
    
    .main-controls { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 16px; margin-bottom: 24px; position: relative; z-index: 10; }
    .btn-secondary { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; transition: var(--transition); }
    .btn-secondary:hover { color: var(--text-main); }
    
    .btn-primary { background-color: var(--text-main); border: none; width: 72px; height: 72px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.6rem; color: var(--bg-main); cursor: pointer; box-shadow: 0 8px 24px rgba(255, 255, 255, 0.1); transition: var(--transition); }
    .btn-primary:hover { transform: scale(1.05); background-color: var(--bg-accent); color: var(--bg-main); }
    
    .bottom-sheet { background-color: var(--bg-card); border-top-left-radius: 32px; border-top-right-radius: 32px; padding: 16px 24px 32px; display: flex; flex-direction: column; align-items: center; }
    .sheet-handle { width: 40px; height: 4px; background-color: #384252; border-radius: 2px; margin-bottom: 20px; }
    .toolbar-features { display: flex; justify-content: space-between; width: 100%; }
    .feature-item { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; color: var(--text-muted); font-size: 0.75rem; font-weight: 500; cursor: pointer; flex: 1; min-width: 0; }
    .feature-item i { font-size: 1.2rem; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background-color: #1F2431; border-radius: 50%; color: var(--text-main); transition: var(--transition); }
    .feature-item:hover i { background-color: var(--bg-accent); color: var(--bg-main); }
    
    @media (min-width: 768px) { .music-app { border: 8px solid #222; } }
  </style>
</head>
<body>

  <div class="music-app">
    <div class="youtube-wrapper" id="yt-container">
      <iframe id="youtube-player" 
              src="https://www.youtube.com/embed/jfKfPfyJRdk?enablejsapi=1&playsinline=1&controls=0&disablekb=1&autoplay=0" 
              allow="autoplay; compute-pressure" 
              style="border: none;">
      </iframe>
    </div>

    <div class="app-header">
      <button class="btn-secondary"><i class="fa-solid fa-chevron-down"></i></button>
      <span>DRIVE COMPANION</span>
      <button class="btn-secondary"><i class="fa-solid fa-ellipsis"></i></button>
    </div>

    <div class="player-body">
      <div class="artwork-wrapper" id="artwork-box">
        <img class="artwork-img" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=500" alt="Track Cover">
      </div>

      <div class="track-info">
        <h2 class="track-title" id="title-display">DriveCompanion Loading...</h2>
        <p class="track-artist">YouTube Stream</p>
      </div>

      <div class="progress-container">
        <div class="progress-bar" id="progress-timeline">
          <div class="progress-current" id="progress-filled"></div>
        </div>
        <div class="progress-time">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="main-controls">
        <button class="btn-secondary"><i class="fa-solid fa-shuffle"></i></button>
        <button class="btn-secondary"><i class="fa-solid fa-backward-step"></i></button>
        <button class="btn-primary" id="play-trigger"><i class="fa-solid fa-play" id="play-icon"></i></button>
        <button class="btn-secondary"><i class="fa-solid fa-forward-step"></i></button>
        <button class="btn-secondary"><i class="fa-solid fa-repeat"></i></button>
      </div>
    </div>

    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="toolbar-features">
        <div class="feature-item">
          <i class="fa-solid fa-list-ul"></i>
          <span>Queue</span>
        </div>
        <div class="feature-item">
          <i class="fa-solid fa-heart"></i>
          <span>Favorites</span>
        </div>
        <div class="feature-item">
          <i class="fa-solid fa-car"></i>
          <span>Drive Mode</span>
        </div>
        <div class="feature-item">
          <i class="fa-solid fa-arrow-down-to-bracket"></i>
          <span>Offline</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    let isFirstPlay = true; 

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    const playTrigger = document.getElementById('play-trigger');
    const playIcon = document.getElementById('play-icon');
    const artworkBox = document.getElementById('artwork-box');
    const titleDisplay = document.getElementById('title-display');
    const progressFilled = document.getElementById('progress-filled');
    const currentTimeText = document.getElementById('current-time');
    const durationText = document.getElementById('duration');
    const timeline = document.getElementById('progress-timeline');
    const ytContainer = document.getElementById('yt-container');
    let timer;

    function onPlayerReady(event) {
      console.log("YouTube Player Ready!");
      if(player && typeof player.getVideoData === 'function') {
        titleDisplay.innerText = player.getVideoData().title || "Lofi Chill Track";
        durationText.innerText = formatTime(player.getDuration());
      }
    }

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        playIcon.className = "fa-solid fa-pause";
        artworkBox.classList.add('playing');
        // Sau cú click đầu kích hoạt âm thanh, đẩy chìm cái lớp bọc iframe xuống để click các nút khác thoải mái
        ytContainer.style.pointerEvents = "none"; 
        isFirstPlay = false;
        startProgressLoop();
      } else {
        playIcon.className = "fa-solid fa-play";
        artworkBox.classList.remove('playing');
        clearInterval(timer);
      }
    }

    // Cơ chế Click Bắt cầu trực tiếp
    playTrigger.addEventListener('click', () => {
      executePlayLogic();
    });

    // Cho phép click thẳng vào cái đĩa nhạc để kích hoạt nếu nút bấm bị bóp nghẹt tương tác
    artworkBox.addEventListener('click', () => {
      executePlayLogic();
    });

    function executePlayLogic() {
      if (!player || typeof player.getPlayerState !== 'function') {
        console.log("Player not fully loaded yet.");
        return;
      }
      const state = player.getPlayerState();
      if (state == YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function startProgressLoop() {
      clearInterval(timer);
      timer = setInterval(() => {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        const current = player.getCurrentTime();
        const duration = player.getDuration();
        if (duration > 0) {
          const percentage = (current / duration) * 100;
          progressFilled.style.width = percentage + "%";
          currentTimeText.innerText = formatTime(current);
        }
      }, 1000);
    }

    timeline.addEventListener('click', (e) => {
      if (!player || typeof player.seekTo !== 'function') return;
      const rect = timeline.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;
      const duration = player.getDuration();
      const seekToTime = (clickX / width) * duration;
      player.seekTo(seekToTime, true);
    });

    function formatTime(time) {
      if (isNaN(time) || time === undefined) return "0:00";
      time = Math.round(time);
      var minutes = Math.floor(time / 60);
      var seconds = time - minutes * 60;
      seconds = seconds < 10 ? '0' + seconds : seconds;
      return minutes + ":" + seconds;
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker Registered!', reg))
          .catch(err => console.log('Service Worker Register Failed', err));
      });
    }
  </script>
</body>
</html>
